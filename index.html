<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Viaje a Japón · Planificador de Ruta Futura 🇯🇵</title>
    <meta name="description" content="Guía y planificador de ruta para el futuro viaje a Japón: 13 etapas, mapa interactivo, transportes, alojamientos y presupuesto." />

    <!-- Favicons (desktop browsers: Chrome, Firefox, Safari, Edge) -->
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="icon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="icon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />

    <!-- iOS / Safari home screen (Add to Home Screen) -->
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Japón Futuro" />

    <!-- Android / Chrome -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#4d1c1e" />

    <!-- Link preview when shared on WhatsApp / iMessage / etc. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Viaje a Japón · Planificador de Ruta Futura 🇯🇵" />
    <meta property="og:description" content="Guía y planificador de ruta para el futuro viaje a Japón: 13 etapas, mapa interactivo, transportes, alojamientos y presupuesto." />
    <meta property="og:image" content="og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Viaje a Japón · Planificador de Ruta Futura 🇯🇵" />
    <meta name="twitter:image" content="og-image.png" />
    <script type="module" crossorigin src="/viaje-japon-futuro/assets/app.js"></script>
    <link rel="stylesheet" crossorigin href="/viaje-japon-futuro/assets/index.css">
  <link rel="manifest" href="/viaje-japon-futuro/manifest.webmanifest"><script id="vite-plugin-pwa:register-sw" src="/viaje-japon-futuro/registerSW.js"></script></head>
  <body>
    <div id="root">
      <!-- Fallback visual inmediato: visible al instante si hay retardo de red o caché, reemplazado por React al montar -->
      <div id="initial-loader" style="min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 28px 20px; background: #f7f0e3; color: #1b1f27; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; text-align: center;">
        <div style="width: 58px; height: 58px; border-radius: 50%; background: rgba(188,71,73,0.12); border: 2px solid rgba(188,71,73,0.25); display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; font-size: 26px;">
          🇯🇵
        </div>
        <h1 style="font-size: 20px; font-weight: 700; color: #1d3557; margin: 0 0 6px; letter-spacing: 0.01em;">
          Viaje a Japón · Planificador Futuro
        </h1>
        <p id="loader-status" style="font-size: 13.5px; color: #5a6070; margin: 0 0 16px; max-width: 320px; line-height: 1.5;">
          Cargando itinerario, mapa y preparativos...
        </p>

        <!-- Tarjeta de contingencia automática (visible tras 2.5s si no ha arrancado React) -->
        <div id="loader-fallback" style="display: none; max-width: 400px; background: #fffdf8; border: 1px solid #e6dcc4; border-radius: 18px; padding: 20px 22px; box-shadow: 0 10px 28px rgba(77,28,30,0.08); margin-top: 8px;">
          <p style="font-size: 13.5px; color: #7a2c2e; font-weight: 700; margin: 0 0 6px;">
            ⚠️ ¿La página no termina de cargar?
          </p>
          <p style="font-size: 12.5px; color: #5a6070; margin: 0 0 16px; line-height: 1.5;">
            Si se acaba de actualizar la web o tienes una versión anterior en caché, pulsa abajo para refrescarla limpiamente:
          </p>
          <div style="display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;">
            <button onclick="window.location.reload(true)" style="padding: 9px 18px; background: #bc4749; color: #fff; border: none; border-radius: 999px; font-size: 12.5px; font-weight: 600; cursor: pointer; box-shadow: 0 2px 6px rgba(188,71,73,0.3);">
              Recargar
            </button>
            <button onclick="if('caches' in window){caches.keys().then(function(k){k.forEach(function(n){caches.delete(n);});});}if(navigator.serviceWorker){navigator.serviceWorker.getRegistrations().then(function(r){r.forEach(function(reg){reg.unregister();});});}localStorage.clear();sessionStorage.clear();window.location.reload(true);" style="padding: 9px 18px; background: #1d3557; color: #fff; border: none; border-radius: 999px; font-size: 12.5px; font-weight: 600; cursor: pointer; box-shadow: 0 2px 6px rgba(29,53,87,0.3);">
              Limpiar caché y recargar
            </button>
          </div>
        </div>
      </div>
    </div>

    <script>
      (function() {
        function showFatalError(title, msg) {
          var fb = document.getElementById('loader-fallback');
          var st = document.getElementById('loader-status');
          if (st) st.innerText = msg || 'Error al iniciar la aplicación.';
          if (fb) {
            fb.style.display = 'block';
            var p = fb.querySelector('p');
            if (p) p.innerText = '⚠️ ' + (title || 'Error al cargar la aplicación');
          }
        }

        // Watchdog: Si tras 2.5s React aún no ha montado el contenido, mostrar el panel de contingencia
        setTimeout(function() {
          var fb = document.getElementById('loader-fallback');
          if (fb && document.getElementById('initial-loader')) {
            fb.style.display = 'block';
          }
        }, 2500);

        // Fallback dinámico para GitHub Pages si se sirve desde la rama main
        if (window.location.hostname.includes('github.io')) {
          setTimeout(function() {
            var loader = document.getElementById('initial-loader');
            if (loader && !document.querySelector('script[src*="assets/app"]')) {
              var base = '/viaje-japon-futuro/';
              var s = document.createElement('script');
              s.type = 'module';
              s.crossOrigin = '';
              s.src = base + 'assets/app.js';
              document.body.appendChild(s);

              if (!document.querySelector('link[href*="assets/index"]')) {
                var l = document.createElement('link');
                l.rel = 'stylesheet';
                l.crossOrigin = '';
                l.href = base + 'assets/index.css';
                document.head.appendChild(l);
              }
            }
          }, 400);
        }

        window.addEventListener('error', function(e) {
          console.error('Global Error caught:', e);
          showFatalError('Error al iniciar la web', e.message);
        });
        window.addEventListener('unhandledrejection', function(e) {
          console.error('Unhandled Promise Rejection:', e);
          var reason = e.reason ? (e.reason.message || String(e.reason)) : 'Fallo en una petición asíncrona.';
          showFatalError('Error de conexión o datos', reason);
        });
      })();
    </script>
  </body>
</html>
